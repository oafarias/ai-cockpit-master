<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIWA | Suporte Inteligente</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <header>
            <h1>AIWA <span>Intelligence</span></h1>
        </header>
        
        <div id="chat-box" class="chat-box">
            <div class="message bot">
                Olá! Sou o assistente da Aiwa. Como posso ajudar com seu produto hoje?
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Descreva o problema ou dúvida...">
            <button id="send-btn">Enviar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
