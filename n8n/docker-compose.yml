version: '3.8'
services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-automation
    restart: always
    environment:
      - N8N_HOST=n8n.aaleff.me
      - NODE_ENV=production
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - proxy-nw
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  n8n_data:

networks:
  proxy-nw:
    external: true
